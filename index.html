<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>线条跑车 LINE DRIVE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='black'/%3E%3Cpath d='M7 21 L11 15 L21 15 L25 21 L25 24 L7 24 Z M9 24 L9 26 M23 24 L23 26' fill='none' stroke='white' stroke-width='1.5'/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #game { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
  </style>
  <script>
    // 启动自愈：模块加载失败（服务器重启/网络闪断后的陈旧标签页）时显示可重试提示
    (function () {
      setTimeout(function () {
        if (window.__LD) return;
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;color:#fff;font:14px/2 ui-monospace,Consolas,monospace;z-index:999;gap:12px;';
        d.innerHTML = '<div>线条跑车 · 启动失败</div>' +
          '<div style="opacity:.55">开发服务器连接中断或页面缓存过期</div>' +
          '<button style="font:inherit;padding:6px 28px;background:none;border:1px solid #fff;color:#fff;cursor:pointer">重新加载</button>';
        d.lastElementChild.onclick = function () { location.reload(); };
        document.body.appendChild(d);
      }, 2500);
    })();
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
